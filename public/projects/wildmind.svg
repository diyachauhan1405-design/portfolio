<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0720"/>
      <stop offset="100%" stop-color="#130a2e"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="glow-md">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow-lg">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="white" stroke-width="0.5">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/>
  </g>

  <!-- Central ambient glow -->
  <circle cx="400" cy="150" r="130" fill="url(#centerGlow)" filter="url(#glow-lg)"/>

  <!-- Neural network edges (blurred glow layer) -->
  <g filter="url(#glow-md)" opacity="0.4">
    <!-- Input → Hidden layer 1 -->
    <line x1="120" y1="80" x2="280" y2="60" stroke="#7C3AED" stroke-width="1.5"/>
    <line x1="120" y1="80" x2="280" y2="130" stroke="#7C3AED" stroke-width="1.5"/>
    <line x1="120" y1="80" x2="280" y2="200" stroke="#6C63FF" stroke-width="1"/>
    <line x1="120" y1="150" x2="280" y2="60" stroke="#6C63FF" stroke-width="1"/>
    <line x1="120" y1="150" x2="280" y2="130" stroke="#7C3AED" stroke-width="1.5"/>
    <line x1="120" y1="150" x2="280" y2="200" stroke="#7C3AED" stroke-width="1.5"/>
    <line x1="120" y1="220" x2="280" y2="130" stroke="#6C63FF" stroke-width="1"/>
    <line x1="120" y1="220" x2="280" y2="200" stroke="#7C3AED" stroke-width="1.5"/>
    <!-- Hidden 1 → Hidden 2 -->
    <line x1="280" y1="60" x2="400" y2="80" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="280" y1="60" x2="400" y2="150" stroke="#8B7FFF" stroke-width="1"/>
    <line x1="280" y1="130" x2="400" y2="80" stroke="#8B7FFF" stroke-width="1.5"/>
    <line x1="280" y1="130" x2="400" y2="150" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="280" y1="130" x2="400" y2="220" stroke="#7C3AED" stroke-width="1"/>
    <line x1="280" y1="200" x2="400" y2="150" stroke="#8B7FFF" stroke-width="1.5"/>
    <line x1="280" y1="200" x2="400" y2="220" stroke="#a78bfa" stroke-width="1.5"/>
    <!-- Hidden 2 → Hidden 3 -->
    <line x1="400" y1="80" x2="520" y2="60" stroke="#6C63FF" stroke-width="1.5"/>
    <line x1="400" y1="80" x2="520" y2="130" stroke="#7C3AED" stroke-width="1"/>
    <line x1="400" y1="150" x2="520" y2="60" stroke="#7C3AED" stroke-width="1"/>
    <line x1="400" y1="150" x2="520" y2="130" stroke="#6C63FF" stroke-width="1.5"/>
    <line x1="400" y1="150" x2="520" y2="200" stroke="#6C63FF" stroke-width="1.5"/>
    <line x1="400" y1="220" x2="520" y2="130" stroke="#7C3AED" stroke-width="1"/>
    <line x1="400" y1="220" x2="520" y2="200" stroke="#6C63FF" stroke-width="1.5"/>
    <!-- Hidden 3 → Output -->
    <line x1="520" y1="60" x2="680" y2="100" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="520" y1="60" x2="680" y2="200" stroke="#6C63FF" stroke-width="1"/>
    <line x1="520" y1="130" x2="680" y2="100" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="520" y1="130" x2="680" y2="200" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="520" y1="200" x2="680" y2="100" stroke="#6C63FF" stroke-width="1"/>
    <line x1="520" y1="200" x2="680" y2="200" stroke="#a78bfa" stroke-width="1.5"/>
  </g>

  <!-- Neural network edges (sharp layer) -->
  <g opacity="0.55">
    <line x1="120" y1="80" x2="280" y2="60" stroke="url(#lineGrad1)" stroke-width="0.8"/>
    <line x1="120" y1="80" x2="280" y2="130" stroke="url(#lineGrad1)" stroke-width="0.8"/>
    <line x1="120" y1="80" x2="280" y2="200" stroke="url(#lineGrad1)" stroke-width="0.5"/>
    <line x1="120" y1="150" x2="280" y2="60" stroke="url(#lineGrad1)" stroke-width="0.5"/>
    <line x1="120" y1="150" x2="280" y2="130" stroke="url(#lineGrad1)" stroke-width="0.8"/>
    <line x1="120" y1="150" x2="280" y2="200" stroke="url(#lineGrad1)" stroke-width="0.8"/>
    <line x1="120" y1="220" x2="280" y2="130" stroke="url(#lineGrad1)" stroke-width="0.5"/>
    <line x1="120" y1="220" x2="280" y2="200" stroke="url(#lineGrad1)" stroke-width="0.8"/>
    <line x1="280" y1="60" x2="400" y2="80" stroke="url(#lineGrad2)" stroke-width="0.8"/>
    <line x1="280" y1="60" x2="400" y2="150" stroke="url(#lineGrad2)" stroke-width="0.5"/>
    <line x1="280" y1="130" x2="400" y2="80" stroke="url(#lineGrad2)" stroke-width="0.8"/>
    <line x1="280" y1="130" x2="400" y2="150" stroke="url(#lineGrad2)" stroke-width="0.8"/>
    <line x1="280" y1="130" x2="400" y2="220" stroke="url(#lineGrad2)" stroke-width="0.5"/>
    <line x1="280" y1="200" x2="400" y2="150" stroke="url(#lineGrad2)" stroke-width="0.8"/>
    <line x1="280" y1="200" x2="400" y2="220" stroke="url(#lineGrad2)" stroke-width="0.8"/>
    <line x1="400" y1="80" x2="520" y2="60" stroke="url(#lineGrad1)" stroke-width="0.8"/>
    <line x1="400" y1="80" x2="520" y2="130" stroke="url(#lineGrad1)" stroke-width="0.5"/>
    <line x1="400" y1="150" x2="520" y2="130" stroke="url(#lineGrad1)" stroke-width="0.8"/>
    <line x1="400" y1="150" x2="520" y2="200" stroke="url(#lineGrad1)" stroke-width="0.8"/>
    <line x1="400" y1="220" x2="520" y2="200" stroke="url(#lineGrad1)" stroke-width="0.8"/>
    <line x1="520" y1="60" x2="680" y2="100" stroke="url(#lineGrad2)" stroke-width="0.8"/>
    <line x1="520" y1="130" x2="680" y2="100" stroke="url(#lineGrad2)" stroke-width="0.8"/>
    <line x1="520" y1="130" x2="680" y2="200" stroke="url(#lineGrad2)" stroke-width="0.8"/>
    <line x1="520" y1="200" x2="680" y2="200" stroke="url(#lineGrad2)" stroke-width="0.8"/>
  </g>

  <!-- Nodes glow layer -->
  <g filter="url(#glow-md)">
    <!-- Input layer -->
    <circle cx="120" cy="80" r="10" fill="#7C3AED" opacity="0.7"/>
    <circle cx="120" cy="150" r="10" fill="#7C3AED" opacity="0.7"/>
    <circle cx="120" cy="220" r="10" fill="#7C3AED" opacity="0.7"/>
    <!-- Hidden 1 -->
    <circle cx="280" cy="60" r="9" fill="#8B5CF6" opacity="0.7"/>
    <circle cx="280" cy="130" r="9" fill="#8B5CF6" opacity="0.7"/>
    <circle cx="280" cy="200" r="9" fill="#8B5CF6" opacity="0.7"/>
    <!-- Hidden 2 (center - brightest) -->
    <circle cx="400" cy="80" r="12" fill="#a78bfa" opacity="0.8"/>
    <circle cx="400" cy="150" r="16" fill="#a78bfa" opacity="0.9"/>
    <circle cx="400" cy="220" r="12" fill="#a78bfa" opacity="0.8"/>
    <!-- Hidden 3 -->
    <circle cx="520" cy="60" r="9" fill="#6C63FF" opacity="0.7"/>
    <circle cx="520" cy="130" r="9" fill="#6C63FF" opacity="0.7"/>
    <circle cx="520" cy="200" r="9" fill="#6C63FF" opacity="0.7"/>
    <!-- Output -->
    <circle cx="680" cy="100" r="11" fill="#5B52E8" opacity="0.8"/>
    <circle cx="680" cy="200" r="11" fill="#5B52E8" opacity="0.8"/>
  </g>

  <!-- Node sharp cores -->
  <g>
    <!-- Input layer -->
    <circle cx="120" cy="80" r="5" fill="#c4b5fd"/>
    <circle cx="120" cy="150" r="5" fill="#c4b5fd"/>
    <circle cx="120" cy="220" r="5" fill="#c4b5fd"/>
    <!-- Hidden 1 -->
    <circle cx="280" cy="60" r="4.5" fill="#ddd6fe"/>
    <circle cx="280" cy="130" r="4.5" fill="#ddd6fe"/>
    <circle cx="280" cy="200" r="4.5" fill="#ddd6fe"/>
    <!-- Hidden 2 center layer -->
    <circle cx="400" cy="80" r="5.5" fill="white"/>
    <circle cx="400" cy="150" r="7" fill="white"/>
    <circle cx="400" cy="220" r="5.5" fill="white"/>
    <!-- Hidden 3 -->
    <circle cx="520" cy="60" r="4.5" fill="#c4b5fd"/>
    <circle cx="520" cy="130" r="4.5" fill="#c4b5fd"/>
    <circle cx="520" cy="200" r="4.5" fill="#c4b5fd"/>
    <!-- Output -->
    <circle cx="680" cy="100" r="5" fill="#a78bfa"/>
    <circle cx="680" cy="200" r="5" fill="#a78bfa"/>
  </g>

  <!-- Floating particles -->
  <g opacity="0.5">
    <circle cx="60" cy="50" r="1.2" fill="#a78bfa"/>
    <circle cx="740" cy="60" r="1" fill="#6C63FF"/>
    <circle cx="750" cy="240" r="1.5" fill="#a78bfa"/>
    <circle cx="50" cy="260" r="1.2" fill="#6C63FF"/>
    <circle cx="350" cy="30" r="1" fill="#c4b5fd"/>
    <circle cx="450" cy="270" r="1" fill="#c4b5fd"/>
  </g>

  <!-- Label -->
  <text x="50" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.2em" fill="white" opacity="0.3">GENERATIVE AI PLATFORM</text>
</svg>
