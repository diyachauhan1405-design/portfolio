<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0614"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="trail1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="trail2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="droneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="droneGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="blur-md">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur-lg">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="300" fill="url(#sky)"/>

  <!-- Stars -->
  <g opacity="0.6">
    <circle cx="42" cy="18" r="0.8" fill="white" opacity="0.7"/>
    <circle cx="120" cy="45" r="0.6" fill="white" opacity="0.5"/>
    <circle cx="200" cy="22" r="1" fill="white" opacity="0.8"/>
    <circle cx="290" cy="55" r="0.7" fill="white" opacity="0.6"/>
    <circle cx="380" cy="15" r="0.9" fill="white" opacity="0.7"/>
    <circle cx="460" cy="40" r="0.6" fill="white" opacity="0.5"/>
    <circle cx="540" cy="25" r="1.1" fill="white" opacity="0.8"/>
    <circle cx="620" cy="50" r="0.7" fill="white" opacity="0.6"/>
    <circle cx="710" cy="18" r="0.9" fill="white" opacity="0.7"/>
    <circle cx="760" cy="38" r="0.6" fill="white" opacity="0.5"/>
    <circle cx="75" cy="70" r="0.7" fill="white" opacity="0.5"/>
    <circle cx="160" cy="85" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="330" cy="30" r="0.6" fill="white" opacity="0.7"/>
    <circle cx="490" cy="65" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="670" cy="75" r="1" fill="white" opacity="0.6"/>
    <circle cx="740" cy="90" r="0.7" fill="white" opacity="0.4"/>
  </g>

  <!-- Light trails - arcing paths between drones -->
  <!-- Formation: roughly circular/heart shape made of drones in light show -->

  <!-- Drone trail arcs (glow effect - blurred layer) -->
  <g filter="url(#blur-md)" opacity="0.5">
    <path d="M 180 200 Q 250 100 320 150" stroke="#6C63FF" stroke-width="3" fill="none"/>
    <path d="M 320 150 Q 400 80 480 140" stroke="#8B7FFF" stroke-width="3" fill="none"/>
    <path d="M 480 140 Q 550 100 620 180" stroke="#00E5FF" stroke-width="3" fill="none"/>
    <path d="M 180 200 Q 200 240 280 230" stroke="#6C63FF" stroke-width="2" fill="none"/>
    <path d="M 280 230 Q 400 260 520 235" stroke="#5B52E8" stroke-width="2" fill="none"/>
    <path d="M 520 235 Q 580 225 620 180" stroke="#00D4EE" stroke-width="2" fill="none"/>
    <path d="M 400 80 Q 400 60 400 45" stroke="#00E5FF" stroke-width="2" fill="none"/>
  </g>

  <!-- Drone trail arcs (sharp layer) -->
  <g opacity="0.9">
    <path d="M 180 200 Q 250 100 320 150" stroke="url(#trail1)" stroke-width="1.5" fill="none"/>
    <path d="M 320 150 Q 400 80 480 140" stroke="#8B7FFF" stroke-width="1.5" fill="none" opacity="0.8"/>
    <path d="M 480 140 Q 550 100 620 180" stroke="url(#trail2)" stroke-width="1.5" fill="none"/>
    <path d="M 180 200 Q 200 240 280 230" stroke="#6C63FF" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M 280 230 Q 400 260 520 235" stroke="#7B72FF" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M 520 235 Q 580 225 620 180" stroke="#00E5FF" stroke-width="1" fill="none" opacity="0.7"/>
  </g>

  <!-- Drone dots - formation spelling out a light show pattern -->
  <!-- Glow halos -->
  <g filter="url(#blur-lg)" opacity="0.6">
    <circle cx="180" cy="200" r="18" fill="#6C63FF"/>
    <circle cx="320" cy="150" r="18" fill="#7B72FF"/>
    <circle cx="400" cy="80" r="22" fill="#00E5FF"/>
    <circle cx="480" cy="140" r="18" fill="#6C63FF"/>
    <circle cx="620" cy="180" r="18" fill="#00E5FF"/>
    <circle cx="280" cy="230" r="14" fill="#6C63FF"/>
    <circle cx="520" cy="235" r="14" fill="#00E5FF"/>
    <circle cx="400" cy="45" r="16" fill="#00E5FF"/>
  </g>

  <!-- Drone dots - medium glow -->
  <g filter="url(#blur-sm)">
    <circle cx="180" cy="200" r="6" fill="#9E98FF"/>
    <circle cx="320" cy="150" r="6" fill="#9E98FF"/>
    <circle cx="400" cy="80" r="7" fill="#00E5FF"/>
    <circle cx="480" cy="140" r="6" fill="#9E98FF"/>
    <circle cx="620" cy="180" r="6" fill="#00E5FF"/>
    <circle cx="280" cy="230" r="5" fill="#8880FF"/>
    <circle cx="520" cy="235" r="5" fill="#00D4EE"/>
    <circle cx="400" cy="45" r="5" fill="#00E5FF"/>
    <circle cx="240" cy="170" r="4" fill="#7B72FF"/>
    <circle cx="560" cy="160" r="4" fill="#00CCDD"/>
    <circle cx="350" cy="250" r="4" fill="#6C63FF"/>
    <circle cx="450" cy="250" r="4" fill="#00E5FF"/>
  </g>

  <!-- Drone dots - sharp core -->
  <g>
    <circle cx="180" cy="200" r="2.5" fill="white"/>
    <circle cx="320" cy="150" r="2.5" fill="white"/>
    <circle cx="400" cy="80" r="3" fill="white"/>
    <circle cx="480" cy="140" r="2.5" fill="white"/>
    <circle cx="620" cy="180" r="2.5" fill="white"/>
    <circle cx="280" cy="230" r="2" fill="white"/>
    <circle cx="520" cy="235" r="2" fill="white"/>
    <circle cx="400" cy="45" r="2" fill="white"/>
    <circle cx="240" cy="170" r="1.8" fill="white"/>
    <circle cx="560" cy="160" r="1.8" fill="white"/>
    <circle cx="350" cy="250" r="1.8" fill="white"/>
    <circle cx="450" cy="250" r="1.8" fill="white"/>
    <!-- Extra ambient drones -->
    <circle cx="130" cy="220" r="1.5" fill="#00E5FF" opacity="0.8"/>
    <circle cx="660" cy="210" r="1.5" fill="#6C63FF" opacity="0.8"/>
    <circle cx="100" cy="160" r="1.3" fill="#9E98FF" opacity="0.7"/>
    <circle cx="700" cy="140" r="1.3" fill="#00CCDD" opacity="0.7"/>
    <circle cx="360" cy="110" r="1.5" fill="#6C63FF" opacity="0.8"/>
    <circle cx="440" cy="110" r="1.5" fill="#00E5FF" opacity="0.8"/>
  </g>

  <!-- Bottom horizon glow -->
  <rect x="0" y="260" width="800" height="40" fill="url(#sky)" opacity="0.5"/>
  <ellipse cx="400" cy="300" rx="300" ry="40" fill="#6C63FF" opacity="0.08"/>

  <!-- FLYBIT label -->
  <text x="50" y="270" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.2em" fill="white" opacity="0.35" text-transform="uppercase">DRONE LIGHT SHOW</text>
</svg>
